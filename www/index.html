function findHeader(rows){

   best={headerIndex:i,idx:found,score};
  }

}
function parseSheet(rows,sheetName=''){

  const code=idx.code>=0?String(row[idx.code]??'').trim():'';

  const section=idx.section>=0?String(row[idx.section]??'').trim():'';
  if(!code&&!name)continue;

 {tab==='audit'&&<><PageTitle title={isAdmin?'Auditoría':'Mi historial'} subtitle="Movimientos registrados con fecha y usuario"/>{isAdmin&&<div className="card p-3 mb-3"><h2 className="font-semibold mb-2">Enviar mensaje interno</h2><select className="field mb-2" value={messageForm.to} onChange={e=>setMessageForm({...messageForm,to:e.target.value})}><option value="">Seleccionar operativo</option>{state.users.filter(u=>u.role==='operator').map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select><textarea className="field mb-2" rows="2" placeholder="Escribe un mensaje…" value={messageForm.text} onChange={e=>setMessageForm({...messageForm,text:e.target.value})}/><button className="btn btn-primary w-full" onClick={sendMessage}>Enviar mensaje</button></div>} {isAdmin&&<section className="card p-4 mt-3"><div className="flex items-center justify-between mb-3"><h2 className="font-semibold">Tiempo de atención por empleado</h2><span className="text-[10px] text-zinc-500">Promedio</span></div>{responseStats.map(r=>{const width=Math.min(100,Math.max(2,r.seconds/Math.max(900,...responseStats.map(x=>x.seconds))*100));return <div className="mb-3 last:mb-0" key={r.id}><div className="flex justify-between text-xs mb-1"><span>{r.name}</span><span className={r.seconds>900?'text-red-400 font-bold':'text-zinc-300'}>{r.total?fmtDuration(r.seconds):'Sin datos'}</span></div><div className="h-2 rounded-full bg-zinc-800 overflow-hidden"><div className="h-full rounded-full" style={{width:width+'%',background:r.seconds>900?'#E53935':'#71717A'}}/></div><div className="text-[10px] text-zinc-600 mt-1">{r.total} gestiones medidas · {r.seconds>900?'Supera 15 minutos':'Dentro de referencia'}</div></div>})}{!responseStats.some(r=>r.total)&&<p className="text-xs text-zinc-500">Aún no hay tiempos de respuesta registrados.</p>}</section>}<div className="card p-4">{state.audit.filter(a=>isAdmin||a.userId===currentUser.id).slice(0,100).map(a=><div key={a.id} className="py-3 border-b border-zinc-800 last:border-0"><div className="flex justify-between gap-2"><span className="font-medium text-sm">{a.action}</span><span className="text-[10px] text-zinc-500">{new Date(a.at).toLocaleString('es-EC')}</span></div><p className="text-xs text-zinc-400 mt-1">{a.detail}</p><p className="text-[10px] text-zinc-600 mt-1">{a.username}</p></div>)}{!state.audit.length&&<p className="text-sm text-zinc-500">Todavía no hay movimientos.</p>}</div></>}
 {tab==='settings'&&<><PageTitle title="Ajustes" subtitle="Almacenamiento local y compatibilidad Android"/><section className="card p-4 mb-3"><h2 className="font-semibold mb-2">Persistencia de datos</h2><p className="text-sm text-zinc-400">Los registros se guardan automáticamente en IndexedDB. LocalStorage conserva metadatos de sesión y del temporizador de alarma en este dispositivo.</p><p className="text-xs text-zinc-500 mt-2">Último guardado: {localStorage.getItem('vigiaStockPro:lastSaved')||'Pendiente'}</p></section><section className="card p-4"><h2 className="font-semibold mb-3">Permisos recomendados para APK Android</h2><div className="space-y-3 text-sm"><div><b>Mostrar sobre otras apps</b><p className="text-xs text-zinc-400">Permite que una capa nativa de la APK muestre avisos sobre otras aplicaciones. El puente Capacitor abre directamente la pantalla de permiso; la ventana superpuesta la administra el servicio Android.</p></div><div><b>Ejecución en segundo plano sin restricciones</b><p className="text-xs text-zinc-400">Configura la batería como “Sin restricciones” si Android lo permite. En la APK integrada, el servicio nativo en primer plano mantiene audio, vibración y WakeLock durante una alarma activa.</p></div><div><b>Sonido y vibración</b><p className="text-xs text-zinc-400">Permite notificaciones y vibración. El navegador puede exigir una primera interacción para habilitar Web Audio.</p></div></div><div className="border-t border-zinc-800 mt-4 pt-3"><h3 className="font-semibold mb-2">Exportación y respaldo</h3><ExportPanel onExcel={exportExcel} onBackup={backup} onRestore={restore}/></div></section></>}
 {tab==='team'&&!isAdmin&&null}
 </main>
 <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-zinc-800 bg-[#111113]/95 backdrop-blur bottom-nav"><div className="max-w-app mx-auto grid grid-cols-5 px-1 pt-2">{nav.map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} className={`flex flex-col items-center gap-1 py-2 text-[10px] ${tab===id?'text-white':'text-zinc-500'}`}><span className={tab===id?'text-accent':''}><Icon name={icon}/></span>{label}</button>)}</div></nav>
 {operatorLocked&&<div className="fixed inset-0 z-[100] bg-black text-white overflow-y-auto overscroll-contain"><div className="max-w-app mx-auto min-h-screen px-4 py-6 flex flex-col justify-center"><div className="border-2 border-accent rounded-2xl p-5 bg-[#160909] text-center"><div className="text-xs uppercase tracking-[.2em] text-red-300 font-bold">Modo alarma continua</div><h1 className="text-2xl font-black mt-2 text-accent">GESTIÓN OBLIGATORIA</h1><p className="text-sm text-zinc-300 mt-2">No puedes continuar hasta completar la validación física del producto.</p><div className="text-4xl font-black tabular-nums mt-4">{String(Math.floor(alarmElapsed/60)).padStart(2,'0')}:{String(alarmElapsed%60).padStart(2,'0')}</div><p className="text-[10px] text-zinc-500 mt-1">TIEMPO TRANSCURRIDO</p></div>{lockItems.map((item,i)=>{const product=item.type==='product'?item.product:(item.alert.productId?myProducts.find(p=>p.id===item.alert.productId):myProducts.find(p=>!p.removed&&!p.managedAt)||myProducts.find(p=>!p.removed));if(!product)return <div key={item.alert.id} className="card border-red-900 p-4 mt-3"><b className="text-red-400">ALERTA DEL SUPERVISOR</b><p className="text-sm mt-2">{item.alert.text}</p><p className="text-xs text-zinc-400 mt-2">No hay productos asociados. Contacta al Supervisor para asignar un producto que requiera gestión física.</p></div>;const f=physical[product.id]||{};return <div key={item.type==='product'?product.id:item.alert.id} className="card border-red-900 p-4 mt-3"><div className="text-xs text-red-400 font-bold">{item.type==='product'?'PRODUCTO CRÍTICO · ACCIÓN INMEDIATA':'ALERTA DEL SUPERVISOR'}</div><div className="font-bold mt-1">{product.name}</div><div className="text-xs text-zinc-400 mt-1">{product.code} · {sectionName(state,product.sectionId)}</div><div className="text-sm text-red-300 mt-2">{item.type==='product'?statusOf(product).label:item.alert.text}</div><div className="mt-4 space-y-3"><label className="block text-sm text-zinc-300">1. Últimos 4 dígitos del código EAN<input className="field mt-1 text-center tracking-[.35em]" type="password" inputMode="numeric" maxLength="4" placeholder="••••" value={f.ean4||''} onChange={e=>setPhysical(v=>({...v,[product.id]:{...f,ean4:e.target.value.replace(/\D/g,'').slice(0,4)}}))}/></label><p className="text-[10px] text-zinc-500">La verificación del código físico y la acción quedarán registradas en auditoría.</p><div className="grid grid-cols-2 gap-2"><button className="btn btn-primary" onClick={()=>completePhysical(product,'discount',30)}>Aplicar rebaja -30%</button><button className="btn btn-primary" onClick={()=>completePhysical(product,'discount',50)}>Aplicar rebaja -50%</button><button className="btn btn-secondary col-span-2" onClick={()=>completePhysical(product,'retired')}>Confirmar Retiro</button></div></div></div>})}</div></div>}
 {employeeForm&&<EmployeeModal form={employeeForm} setForm={setEmployeeForm} state={state} onSave={saveEmployee}/>}
 {toast&&<Toast text={toast}/>}
 </div>;
}
function Metric({label,value,color}){const c=color==='red'?'text-accent':color==='amber'?'text-amber':'text-emerald';return <div className="card p-3"><div className={`text-2xl font-bold ${c}`}>{value}</div><div className="text-[10px] text-zinc-500 mt-1">{label}</div></div>}
function PageTitle({title,subtitle}){return <div className="mb-4"><h1 className="text-2xl font-bold">{title}</h1><p className="text-sm text-zinc-500 mt-1">{subtitle}</p></div>}
function ImportControl({onFile,busy}){return <label className={`btn btn-primary w-full cursor-pointer ${busy?'opacity-50':''}`}><input type="file" accept=".xlsx,.xls,.csv" disabled={busy} onChange={e=>{onFile(e.target.files[0]);e.target.value='';}}/>{busy?'Procesando archivo…':'Seleccionar Excel o CSV'}</label>}
function InventoryList({products,state,search,setSearch,filter,setFilter,onAction,isSupervisor=false,onSendAlert}){return <><div className="flex gap-2 mb-3"><input className="field flex-1 min-w-0" placeholder="Buscar código o producto" value={search} onChange={e=>setSearch(e.target.value)}/><select className="field w-32" value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">Todos</option><option value="critical">Críticos</option><option value="soon">Próximos</option><option value="ok">Vigentes</option></select></div><div className="space-y-2">{products.map(p=>{const st=statusOf(p),owner=state.users.find(u=>u.id===p.assignedTo&&u.role==='operator'&&u.active)||state.users.find(u=>u.role==='operator'&&u.active&&u.sections.includes(p.sectionId));return <article key={p.id} className={`card p-3 ${st.kind==='critical'?'border-l-4 border-l-accent':''}`}><div className="flex justify-between gap-3"><div className="min-w-0"><div className="font-semibold break-words">{p.name}</div><div className="text-xs text-zinc-500 mt-1">{p.code} · {sectionName(state,p.sectionId)}</div><div className="text-xs text-zinc-500 mt-1">Cant. {p.quantity} · {p.location||'Sin ubicación'} · {p.expiry||'Sin fecha'}</div></div><Status status={st}/></div>{owner&&<div className="text-[11px] text-zinc-500 mt-2">Responsable: {owner.name}</div>}{!p.managedAt&&!p.removed&&st.discount>0&&<button className="btn btn-primary w-full mt-3" onClick={()=>onAction(p,'discount',st.discount)}>Aplicar rebaja -{st.discount}%</button>}{!p.managedAt&&!p.removed&&st.kind==='critical'&&<button className="btn btn-secondary w-full mt-3" onClick={()=>onAction(p,'retired')}>Marcar como retirado</button>}{isSupervisor&&<button className="btn btn-primary w-full mt-3" disabled={!owner} onClick={()=>onSendAlert?.(p)}>{owner?`Enviar alerta a ${owner.name}`:'Sin responsable asignado'}</button>}{p.managedAt&&<div className="text-xs text-emerald-400 mt-2">Gestionado · {new Date(p.managedAt).toLocaleString('es-EC')}</div>}</article>})}{!products.length&&<div className="card p-8 text-center text-sm text-zinc-500">No hay productos para mostrar.</div>}</div></>}
function Status({status}){const cls=status.kind==='critical'?'text-red-300 bg-red-950/60':status.discount===50?'text-amber bg-amber-950/40':status.discount===30?'text-amber bg-amber-950/30':'text-emerald bg-emerald-950/30';return <span className={`shrink-0 text-[10px] px-2 py-1 rounded-full h-fit max-w-[112px] text-center ${cls}`}>{status.label}</span>}
function ExportPanel({onExcel,onBackup,onRestore}){return <section className="card p-4 mt-4"><h2 className="font-semibold mb-3">Exportar y respaldar</h2><div className="grid grid-cols-2 gap-2"><button className="btn btn-secondary" onClick={onExcel}>Exportar Excel</button><button className="btn btn-secondary" onClick={onBackup}>Respaldo JSON</button><label className="btn btn-quiet col-span-2 cursor-pointer"><input type="file" accept=".json,application/json" onChange={e=>{onRestore(e.target.files[0]);e.target.value='';}}/>Restaurar JSON</label></div></section>}
function SectionChart({state}){const data=state.sections.map(s=>({name:s.name.replace(/^Sec\s*/,'Sec '),count:state.products.filter(p=>p.sectionId===s.id&&!p.removed).length}));const max=Math.max(1,...data.map(d=>d.count));return <div className="space-y-3">{data.map(d=><div key={d.name}><div className="flex justify-between text-xs mb-1"><span className="text-zinc-300">{d.name}</span><span className="text-zinc-500">{d.count}</span></div><div className="h-2 bg-zinc-800 rounded-full overflow-hidden"><div className="h-full bg-accent rounded-full" style={{width:(d.count/max*100)+'%'}}/></div></div>)}</div>}
function EmployeeModal({form,setForm,state,onSave}){const toggle=id=>setForm(f=>({...f,sections:f.sections.includes(id)?f.sections.filter(x=>x!==id):[...f.sections,id]}));return <div className="fixed inset-0 z-50 bg-black/80 flex items-end sm:items-center justify-center p-3"><div className="card w-full max-w-md p-5 max-h-[90vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h2 className="font-bold text-lg">{form.id?'Editar empleado':'Nuevo empleado'}</h2><button className="text-zinc-400 text-xl" onClick={()=>setForm(null)}>×</button></div><div className="space-y-3"><label className="block text-sm text-zinc-400">Nombre<input className="field mt-1" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></label><label className="block text-sm text-zinc-400">Usuario<input className="field mt-1" value={form.username} onChange={e=>setForm({...form,username:e.target.value})}/></label><label className="block text-sm text-zinc-400">Contraseña / restablecer<input className="field mt-1" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/></label><label className="block text-sm text-zinc-400">Meta personal<input className="field mt-1" type="number" min="1" value={form.goal} onChange={e=>setForm({...form,goal:Number(e.target.value)})}/></label><div><p className="text-sm text-zinc-400 mb-2">Secciones asignadas</p>{state.sections.map(s=><label key={s.id} className="flex gap-2 items-center py-1 text-sm"><input type="checkbox" checked={form.sections.includes(s.id)} onChange={()=>toggle(s.id)}/>{s.name}</label>)}</div><label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={form.active} onChange={e=>setForm({...form,active:e.target.checked})}/>Cuenta activa</label><button className="btn btn-primary w-full" onClick={()=>onSave(form)} disabled={!form.name.trim()||!form.username.trim()||!form.password.trim()||!form.sections.length}>Guardar empleado</button></div></div></div>}
function Toast({text}){return <div className="fixed z-[150] bottom-24 left-1/2 -translate-x-1/2 bg-zinc-100 text-black text-sm font-medium rounded-xl px-4 py-3 shadow-xl w-[calc(100%-2rem)] max-w-sm text-center">{text}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
