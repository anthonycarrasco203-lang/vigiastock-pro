name: Compilar APK VigiaStock Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "VigíaStock Pro" "com.vigiastock.pro" --web-dir=www
          npx cap add android
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-config/MainActivity.kt android/app/src/main/java/com/vigiastock/pro/MainActivity.kt
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VigiaStock-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
