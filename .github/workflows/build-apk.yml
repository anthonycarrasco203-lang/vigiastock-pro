name: Compilar APK VigiaStock Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Construir proyecto Android y APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "VigíaStock Pro" "com.vigiastock.pro" --web-dir=www
          npx cap add android
          node -e '
            const fs = require("fs");
            const mPath = "android/app/src/main/AndroidManifest.xml";
            let m = fs.readFileSync(mPath, "utf8");
            const perms = [
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
            ].map(p => `<uses-permission android:name="${p}" />`).join("\n    ");
            m = m.replace("<application", perms + "\n    <application android:usesCleartextTraffic=\"true\"");
            fs.writeFileSync(mPath, m);
          '
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VigiaStock-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
