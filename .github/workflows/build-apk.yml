name: Compilar APK VigiaStock Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Construir proyecto Android y APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "VigiaStock Pro" "com.vigiastock.pro" --web-dir=www
          npx cap add android
          node -e '
            const fs = require("fs");
            const mPath = "android/app/src/main/AndroidManifest.xml";
            let m = fs.readFileSync(mPath, "utf8");
            m = m.replace("<application", "<uses-permission android:name=\"android.permission.VIBRATE\"/><uses-permission android:name=\"android.permission.WAKE_LOCK\"/><uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/><uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/><uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/><uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/><uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\"/><application android:usesCleartextTraffic=\"true\"");
            fs.writeFileSync(mPath, m);

            const javaCode = `package com.vigiastock.pro;
            import android.Manifest;
            import android.app.AlarmManager;
            import android.app.NotificationChannel;
            import android.app.NotificationManager;
            import android.app.PendingIntent;
            import android.content.ContentValues;
            import android.content.Context;
            import android.content.Intent;
            import android.content.SharedPreferences;
            import android.net.Uri;
            import android.os.Build;
            import android.os.Bundle;
            import android.os.Environment;
            import android.os.SystemClock;
            import android.provider.MediaStore;
            import android.provider.Settings;
            import android.util.Base64;
            import android.webkit.JavascriptInterface;
            import androidx.core.app.ActivityCompat;
            import androidx.core.app.NotificationCompat;
            import com.getcapacitor.BridgeActivity;
            import java.io.File;
            import java.io.FileOutputStream;
            import java.io.OutputStream;

            public class MainActivity extends BridgeActivity {
                @Override
                public void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        NotificationChannel ch = new NotificationChannel("vigiastock_alerts", "Alertas Criticas", NotificationManager.IMPORTANCE_HIGH);
                        ch.enableVibration(true);
                        getSystemService(NotificationManager.class).createNotificationChannel(ch);
                    }
                    getBridge().getWebView().addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                    requestAllSystemPermissions();
                }

                public void requestAllSystemPermissions() {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                    }
                    if (!Settings.canDrawOverlays(this)) {
                        startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                    }
                }

                @Override
                public void onStop() {
                    super.onStop();
                    SharedPreferences prefs = getSharedPreferences("VigiaPrefs", MODE_PRIVATE);
                    if (prefs.getBoolean("alarmActive", false)) {
                        scheduleReopenIn5Sec();
                    }
                }

                private void scheduleReopenIn5Sec() {
                    AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                    Intent intent = new Intent(this, MainActivity.class);
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                    PendingIntent pi = PendingIntent.getActivity(this, 999, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                    if (am != null) {
                        am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 5000, pi);
                    }
                }

                public class AndroidBridge {
                    MainActivity act;
                    AndroidBridge(MainActivity a) { this.act = a; }

                    @JavascriptInterface
                    public void requestAllPermissions() {
                        act.runOnUiThread(() -> act.requestAllSystemPermissions());
                    }

                    @JavascriptInterface
                    public void setAlarmLock(boolean active) {
                        act.getSharedPreferences("VigiaPrefs", MODE_PRIVATE).edit().putBoolean("alarmActive", active).apply();
                        if (active) act.scheduleReopenIn5Sec();
                    }

                    @JavascriptInterface
                    public void showNotification(String title, String body) {
                        NotificationCompat.Builder b = new NotificationCompat.Builder(act, "vigiastock_alerts")
                            .setSmallIcon(android.R.drawable.ic_dialog_alert)
                            .setContentTitle(title)
                            .setContentText(body)
                            .setPriority(NotificationCompat.PRIORITY_MAX)
                            .setAutoCancel(true);
                        NotificationManager nm = (NotificationManager) act.getSystemService(Context.NOTIFICATION_SERVICE);
                        if (nm != null) nm.notify((int) System.currentTimeMillis(), b.build());
                    }

                    @JavascriptInterface
                    public void saveExcelBase64(String fileName, String base64Data) {
                        try {
                            byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                ContentValues values = new ContentValues();
                                values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                                values.put(MediaStore.Downloads.MIME_TYPE, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
                                Uri uri = act.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                if (uri != null) {
                                    try (OutputStream os = act.getContentResolver().openOutputStream(uri)) {
                                        if (os != null) os.write(bytes);
                                    }
                                }
                            } else {
                                File file = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), fileName);
                                try (FileOutputStream fos = new FileOutputStream(file)) {
                                    fos.write(bytes);
                                }
                            }
                            showNotification("Reporte Excel Guardado", "Revisa tu carpeta Descargas: " + fileName);
                        } catch (Exception e) {
                            e.printStackTrace();
                        }
                    }
                }
            }`;
            fs.writeFileSync("android/app/src/main/java/com/vigiastock/pro/MainActivity.java", javaCode);
          '
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VigiaStock-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
