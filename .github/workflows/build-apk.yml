name: Compilar APK VigiaStock Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Construir proyecto Android y APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "VigiaStock Pro" "com.vigiastock.pro" --web-dir=www
          npx cap add android
          node -e 'const fs=require("fs");const p="android/app/src/main/AndroidManifest.xml";let m=fs.readFileSync(p,"utf8");m=m.replace("<application","<uses-permission android:name=\"android.permission.VIBRATE\"/><uses-permission android:name=\"android.permission.WAKE_LOCK\"/><uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/><uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/><uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\"/><application android:usesCleartextTraffic=\"true\"");fs.writeFileSync(p,m);'
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VigiaStock-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
